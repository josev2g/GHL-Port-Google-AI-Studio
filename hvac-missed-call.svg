<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="mctbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <filter id="mctbShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1000" height="680" fill="url(#mctbGrad)"/>
  <g opacity="0.12">
    <pattern id="dotGridMctb" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#38bdf8"/>
    </pattern>
    <rect width="1000" height="680" fill="url(#dotGridMctb)"/>
  </g>

  <!-- Top Bar -->
  <rect x="0" y="0" width="1000" height="52" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="56" y="32" fill="#f8fafc" font-size="14" font-weight="700">[HVAC] Speed-to-Lead: Missed Call Text Back Workflow</text>
  <rect x="780" y="13" width="200" height="26" rx="13" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
  <circle cx="796" cy="26" r="4" fill="#10b981"/>
  <text x="808" y="30" fill="#34d399" font-size="11" font-weight="700" font-family="monospace">&lt; 60s SUB-MINUTE SPEED</text>

  <!-- Connectors -->
  <path d="M 500 135 L 500 175" stroke="#10b981" stroke-width="2"/>
  <path d="M 500 235 L 500 275" stroke="#8b5cf6" stroke-width="2"/>
  <path d="M 500 335 L 500 375" stroke="#3b82f6" stroke-width="2"/>
  <path d="M 500 435 L 500 475" stroke="#06b6d4" stroke-width="2"/>
  <path d="M 500 535 L 500 575" stroke="#f59e0b" stroke-width="2"/>

  <!-- NODE 1: Trigger (Missed Call) -->
  <g transform="translate(350, 75)" filter="url(#mctbShadow)">
    <rect width="300" height="60" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <rect x="12" y="12" width="36" height="36" rx="8" fill="#10b981" fill-opacity="0.2"/>
    <text x="30" y="35" fill="#34d399" font-size="16" font-weight="bold" text-anchor="middle">&#128222;</text>
    <text x="58" y="27" fill="#34d399" font-size="11" font-weight="800" font-family="monospace">INBOUND CALL DETAILS</text>
    <text x="58" y="44" fill="#f8fafc" font-size="12" font-weight="700">Inbound Missed Call (Busy / No Answer)</text>
  </g>

  <!-- NODE 2: Wait 1 Minute -->
  <g transform="translate(350, 175)" filter="url(#mctbShadow)">
    <rect width="300" height="60" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="12" y="12" width="36" height="36" rx="8" fill="#8b5cf6" fill-opacity="0.2"/>
    <text x="30" y="35" fill="#a78bfa" font-size="16" font-weight="bold" text-anchor="middle">&#9201;</text>
    <text x="58" y="27" fill="#a78bfa" font-size="11" font-weight="800" font-family="monospace">TIMING BUFFER</text>
    <text x="58" y="44" fill="#f8fafc" font-size="12" font-weight="700">Wait 1 Minute (Avoid Call Collisions)</text>
  </g>

  <!-- NODE 3: Create Opportunity -->
  <g transform="translate(350, 275)" filter="url(#mctbShadow)">
    <rect width="300" height="60" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="12" y="12" width="36" height="36" rx="8" fill="#3b82f6" fill-opacity="0.2"/>
    <text x="30" y="35" fill="#60a5fa" font-size="16" font-weight="bold" text-anchor="middle">$</text>
    <text x="58" y="27" fill="#60a5fa" font-size="11" font-weight="800" font-family="monospace">PIPELINE CRM SYNC</text>
    <text x="58" y="44" fill="#f8fafc" font-size="12" font-weight="700">Create Inbound Lead Opportunity</text>
  </g>

  <!-- NODE 4: Dispatch Emergency Text -->
  <g transform="translate(350, 375)" filter="url(#mctbShadow)">
    <rect width="300" height="60" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
    <rect x="12" y="12" width="36" height="36" rx="8" fill="#06b6d4" fill-opacity="0.2"/>
    <text x="30" y="35" fill="#38bdf8" font-size="16" font-weight="bold" text-anchor="middle">&#128172;</text>
    <text x="58" y="27" fill="#38bdf8" font-size="11" font-weight="800" font-family="monospace">AUTOMATED 2-WAY SMS</text>
    <text x="58" y="44" fill="#f8fafc" font-size="12" font-weight="700">Dispatch Emergency Text</text>
  </g>

  <!-- NODE 5: Alert Dispatch Desk -->
  <g transform="translate(350, 475)" filter="url(#mctbShadow)">
    <rect width="300" height="60" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="12" y="12" width="36" height="36" rx="8" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="30" y="35" fill="#fbbf24" font-size="16" font-weight="bold" text-anchor="middle">&#128276;</text>
    <text x="58" y="27" fill="#fbbf24" font-size="11" font-weight="800" font-family="monospace">INTERNAL NOTIFICATION</text>
    <text x="58" y="44" fill="#f8fafc" font-size="12" font-weight="700">Alert Dispatch Desk (In-App &amp; Push)</text>
  </g>

  <!-- Terminal State -->
  <g transform="translate(460, 575)">
    <rect width="80" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="40" y="19" fill="#94a3b8" font-size="11" font-weight="700" text-anchor="middle" font-family="monospace">END</text>
  </g>
</svg>
