<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="reviewGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <filter id="revShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1000" height="620" fill="url(#reviewGrad)"/>
  <g opacity="0.12">
    <pattern id="dotGridReview" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#38bdf8"/>
    </pattern>
    <rect width="1000" height="620" fill="url(#dotGridReview)"/>
  </g>

  <!-- Top Bar -->
  <rect x="0" y="0" width="1000" height="52" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="56" y="32" fill="#f8fafc" font-size="14" font-weight="700">[HVAC] Reputation: Post-Service Google Review Request</text>
  <rect x="770" y="13" width="210" height="26" rx="13" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
  <circle cx="786" cy="26" r="4" fill="#f59e0b"/>
  <text x="798" y="30" fill="#fbbf24" font-size="11" font-weight="700" font-family="monospace">&#9733;&#9733;&#9733;&#9733;&#9733; 5-STAR ENGINE</text>

  <!-- Connectors -->
  <path d="M 500 135 L 500 195" stroke="#3b82f6" stroke-width="2"/>
  <path d="M 500 255 L 500 315" stroke="#8b5cf6" stroke-width="2"/>
  <path d="M 500 375 L 500 435" stroke="#10b981" stroke-width="2"/>
  <path d="M 500 495 L 500 525" stroke="#64748b" stroke-width="2"/>

  <!-- NODE 1: Trigger (Pipeline stage: Job Won / Invoiced) -->
  <g transform="translate(340, 75)" filter="url(#revShadow)">
    <rect width="320" height="60" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="12" y="12" width="36" height="36" rx="8" fill="#3b82f6" fill-opacity="0.2"/>
    <text x="30" y="35" fill="#60a5fa" font-size="16" font-weight="bold" text-anchor="middle">&#128260;</text>
    <text x="58" y="27" fill="#60a5fa" font-size="11" font-weight="800" font-family="monospace">PIPELINE STAGE CHANGED</text>
    <text x="58" y="44" fill="#f8fafc" font-size="12" font-weight="700">Job Won / Invoiced</text>
  </g>

  <!-- NODE 2: Wait 1 Hour Post-Service -->
  <g transform="translate(360, 195)" filter="url(#revShadow)">
    <rect width="280" height="60" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="12" y="12" width="36" height="36" rx="8" fill="#8b5cf6" fill-opacity="0.2"/>
    <text x="30" y="35" fill="#a78bfa" font-size="16" font-weight="bold" text-anchor="middle">&#9201;</text>
    <text x="58" y="27" fill="#a78bfa" font-size="11" font-weight="800" font-family="monospace">PEAK SATISFACTION WINDOW</text>
    <text x="58" y="44" fill="#f8fafc" font-size="12" font-weight="700">Wait 1 Hour Post-Service</text>
  </g>

  <!-- NODE 3: Send Review Request SMS -->
  <g transform="translate(340, 315)" filter="url(#revShadow)">
    <rect width="320" height="60" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <rect x="12" y="12" width="36" height="36" rx="8" fill="#10b981" fill-opacity="0.2"/>
    <text x="30" y="35" fill="#34d399" font-size="16" font-weight="bold" text-anchor="middle">&#128172;</text>
    <text x="58" y="27" fill="#34d399" font-size="11" font-weight="800" font-family="monospace">DIRECT GOOGLE REVIEW LINK</text>
    <text x="58" y="44" fill="#f8fafc" font-size="12" font-weight="700">Send Review Request SMS</text>
  </g>

  <!-- NODE 4: Reputation & GMB Booster Badge -->
  <g transform="translate(350, 435)" filter="url(#revShadow)">
    <rect width="300" height="60" rx="10" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="12" y="12" width="36" height="36" rx="8" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="30" y="35" fill="#fbbf24" font-size="16" font-weight="bold" text-anchor="middle">&#9733;</text>
    <text x="58" y="27" fill="#fbbf24" font-size="11" font-weight="800" font-family="monospace">LOCAL SEO REPUTATION BOOST</text>
    <text x="58" y="44" fill="#fef3c7" font-size="12" font-weight="700">5-Star Google Review Captured</text>
  </g>

  <!-- Terminal State -->
  <g transform="translate(460, 525)">
    <rect width="80" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="40" y="19" fill="#94a3b8" font-size="11" font-weight="700" text-anchor="middle" font-family="monospace">END</text>
  </g>
</svg>
